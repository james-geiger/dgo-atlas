# Appendix C, plus `related` on clinical study (handoff §5.3 variant).
# Two statements, written as LinkML instance data:
#
# 1. Morgan Ellis is the chair of the Research Data Governance
#    Committee, which takes part in Research Data Governance,
#    a part of Data Governance at Northfield University.
#
# 2. "Clinical trial" is a glossary term defined as "a study in which participants
#    are prospectively assigned to a treatment". It is owned by the Clinical Trials
#    Office, is part of the Business Glossary, is in the Clinical Research
#    subject area (and through it the Research domain), is
#    governed by the Research Data Governance Committee, and was
#    proposed on 2026-09-25, submitted for review on 2026-09-27, and approved on
#    2026-09-28. The Research Data Governance Committee is its
#    steward. It narrows the broader term "clinical study", later gained a cited
#    definition source through a modification, and replaces the deprecated
#    term "clinical investigation".

# --- governance ---------------------------------------------------------------

processes:
  - id: ex:northfield-dg
    label: Data Governance at Northfield University
  - id: ex:research-dg
    label: Research Data Governance
    part_of: ex:northfield-dg

councils:
  - id: ex:research-committee
    label: Research Data Governance Committee
    participates_in: ex:research-dg        # the committee governs what happens in research data governance
    has_member:
      - ex:morgan-ellis

people:
  - id: ex:morgan-ellis
    label: Morgan Ellis
    title: Director, Data Governance
    email: morgan.ellis@example.edu

organizations:
  - id: ex:cto
    label: Clinical Trials Office
    email: cto@example.org

council_roles:
  - type: dgo:DGO_00000006           # chair
    role_of: ex:morgan-ellis
    realized_in: ex:research-dg

# --- glossary -----------------------------------------------------------------

business_glossaries:
  - id: ex:business-glossary
    label: Business Glossary

domains:
  - id: ex:research
    label: Research
    part_of: ex:business-glossary

subject_areas:
  - id: ex:clinical-research
    label: Clinical Research
    part_of: ex:research

glossary_terms:
  - id: ex:clinical-trial
    label: clinical trial
    pref_label: Clinical Trial       # shown to readers when it differs from the label
    alt_labels:
      - interventional study
    definition: a study in which participants are prospectively assigned to a treatment
    definition_source: https://grants.nih.gov/policy/clinical-trials/definition.htm
    part_of: ex:business-glossary        # containment: every term is part of exactly one glossary
    in_subject_area: ex:clinical-research   # classification; its domain is one step further
    broader:
      - ex:clinical-study
    responsibilities:                # current assignments, held with respect to this term
      - type: dgo:DGO_00000012       # owner
        role_of: ex:cto
      - type: dgo:DGO_00000013       # steward (a council can bear a governance role)
        role_of: ex:research-committee

  - id: ex:clinical-study
    label: clinical study
    definition: a research study involving human participants
    related:
      - ex:clinical-trial            # written once; read from both terms
    part_of: ex:business-glossary
    in_subject_area: ex:clinical-research

  - id: ex:clinical-investigation
    label: clinical investigation
    definition: a study of a treatment in human participants
    part_of: ex:business-glossary
    in_subject_area: ex:clinical-research
    replaced_by: ex:clinical-trial   # its successor; deprecated by ex:clinical-investigation-deprecation

definition_sources:              # id is the source's IRI; label describes it
  - id: https://grants.nih.gov/policy/clinical-trials/definition.htm
    label: NIH definition of a clinical trial

# --- how the terms came to be -------------------------------------------------

term_creations:
  - id: ex:clinical-trial-creation
    label: Creation of the term "clinical trial"
    has_output: ex:clinical-trial
    part_of: ex:research-dg                # created within research data governance, so governed by its committee

term_modifications:
  - id: ex:clinical-trial-modification
    label: Addition of a definition source to "clinical trial"
    has_output: ex:clinical-trial    # same term, same id: a modification changes it, not replaces it
    part_of: ex:research-dg

term_deprecations:
  - id: ex:clinical-investigation-deprecation
    label: Deprecation of the term "clinical investigation"
    has_output: ex:clinical-investigation
    part_of: ex:research-dg                # deprecated once this process reaches its approved boundary

term_status_boundaries:        # quote dates: LinkML validation rejects unquoted YAML dates
  - type: dgo:DGO_00000024           # drafted (proposed)
    part_of: ex:clinical-trial-creation
    occurred_on: "2026-09-25"
  - type: dgo:DGO_00000025           # submitted for review
    part_of: ex:clinical-trial-creation
    occurred_on: "2026-09-27"
  - type: dgo:DGO_00000026           # approved
    part_of: ex:clinical-trial-creation
    occurred_on: "2026-09-28"

  - type: dgo:DGO_00000024           # modification drafted
    part_of: ex:clinical-trial-modification
    occurred_on: "2026-10-05"
  - type: dgo:DGO_00000026           # modification approved
    part_of: ex:clinical-trial-modification
    occurred_on: "2026-10-12"

  - type: dgo:DGO_00000024           # deprecation drafted
    part_of: ex:clinical-investigation-deprecation
    occurred_on: "2026-10-05"
  - type: dgo:DGO_00000026           # deprecation approved: the term is now deprecated
    part_of: ex:clinical-investigation-deprecation
    occurred_on: "2026-10-12"
