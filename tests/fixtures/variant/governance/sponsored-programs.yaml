# Not in the handoff: two terms still going through creation, adapted from a
# university research glossary. "direct cost" has been submitted for review;
# "indirect cost" has only been drafted. Both are published as proposed;
# their history shows how far each has got. `type` values here are DGO class
# names; governance.yaml writes the class CURIEs. Both mean the same.

organizations:
  - id: ex:spo
    label: Sponsored Programs Office
    email: sponsoredprograms@example.org

subject_areas:
  - id: ex:sponsored-programs
    label: Sponsored Programs
    part_of: ex:research

definition_sources:
  - id: https://grants.nih.gov/grants/policy/nihgps/HTML5/section_7/7.3_direct_costs_and_indirect_costs.htm
    label: "NIH Grants Policy Statement 7.3: Direct Costs and Indirect Costs"

glossary_terms:
  - id: ex:direct-cost
    label: direct cost
    pref_label: Direct Cost
    definition: >-
      A cost that can be identified specifically with a particular sponsored
      project, an instructional activity, or any other institutional activity,
      or that can be directly assigned to such activities relatively easily
      with a high degree of accuracy.
    definition_source: https://grants.nih.gov/grants/policy/nihgps/HTML5/section_7/7.3_direct_costs_and_indirect_costs.htm
    part_of: ex:business-glossary
    in_subject_area: ex:sponsored-programs
    responsibilities:
      - type: owner
        role_of: ex:spo
      - type: steward
        role_of: ex:research-committee

  - id: ex:indirect-cost
    label: indirect cost
    pref_label: Indirect Cost
    alt_labels:
      - Facilities and Administrative costs (F&A)
    definition: >-
      Necessary costs incurred for a common or joint purpose that cannot be
      readily identified with an individual project or program.
    definition_source: https://grants.nih.gov/grants/policy/nihgps/HTML5/section_7/7.3_direct_costs_and_indirect_costs.htm
    part_of: ex:business-glossary
    in_subject_area: ex:sponsored-programs
    related:
      - ex:direct-cost
    responsibilities:
      - type: owner
        role_of: ex:spo
      - type: data trustee           # a local subclass of steward (local-classes.yaml)
        role_of: ex:research-committee

term_creations:
  - id: ex:direct-cost-creation
    label: Creation of the term "direct cost"
    has_output: ex:direct-cost
    part_of: ex:research-dg
  - id: ex:indirect-cost-creation
    label: Creation of the term "indirect cost"
    has_output: ex:indirect-cost
    part_of: ex:research-dg

term_status_boundaries:
  - type: drafted
    part_of: ex:direct-cost-creation
    occurred_on: "2026-09-10"
  - type: submitted for review           # "direct cost" is in review
    part_of: ex:direct-cost-creation
    occurred_on: "2026-09-17"
  - type: drafted           # "indirect cost" is only drafted
    part_of: ex:indirect-cost-creation
    occurred_on: "2026-09-20"
