governance:
  eyebrow: Governance
  title: How governance is organized
  lede: >-
    Data governance is carried out in processes, each part of a broader one.
    Councils take part in a process, and govern every term created, changed or
    deprecated within it.
  processes: Governance processes
  processes_empty: No governance processes are recorded yet.
  councils: Councils
  councils_empty: No councils are recorded yet.

how_to_read:
  eyebrow: Start here
  title: How to read a term
  lede: Every term page is built from the same facts. This page says what each one means.
  description: What each part of a term page means.
  ontology_version: Data Governance Ontology {dgo_version}
  on_this_page: On this page
  state: What the state means
  state_intro: >-
    A term has no status field. Its state is worked out from its lifecycle:
    the dated steps of its creation, modifications and deprecation.
  state_outro: >-
    A modification never changes the state. While one is open the page shows
    it as a change under review; once approved, the term already reads as
    changed.
  lifecycle: Lifecycle
  lifecycle_steps: "Each process moves through dated steps:"
  roles: Who is responsible
  roles_intro: >-
    A role is borne by a person, an organization or a council. The role isn't
    the person, and a term's page lists who currently holds each role.
  council_roles: Council seats
  fields: Every field on a term
  required: required
  no_description: No description in DGO.

