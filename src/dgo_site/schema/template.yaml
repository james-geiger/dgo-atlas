id: https://w3id.org/dgo-site/template
name: dgo_site_template
title: DGO governance data
description: >-
  The shape of an implementer's governance data. Imports the Data Governance
  Ontology (DGO) unchanged and adds only a document root whose lists hold the
  identified objects. Every list is optional, so each data file may hold any
  subset; the middleware merges all files into one record before checking
  references.
version: 0.1.0
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  dgo: https://w3id.org/dgo/
  dgosite: https://w3id.org/dgo-site/
default_prefix: dgosite
# DGO declares this too, but LinkML reads default_range (and prefixes) from
# the root schema only. Without it `label` has no range and linkml-convert
# cannot write RDF. dgo.use() copies DGO's prefixes in for the same reason.
default_range: string
imports:
  - linkml:types
  # Replaced at runtime (dgo.use) with the project's DGO release, e.g.
  # https://raw.githubusercontent.com/james-geiger/dgo/refs/tags/0.1.0/dist/dgo
  - DGO_IMPORT

classes:
  GovernanceRecord:
    class_uri: dgosite:GovernanceRecord
    tree_root: true
    description: >-
      One governance data file. All lists are optional; files are merged by
      concatenating their lists.
    slots:
      - processes
      - councils
      - people
      - organizations
      - council_roles
      - governance_roles
      - business_glossaries
      - domains
      - subject_areas
      - glossary_terms
      - definition_sources
      - term_creations
      - term_modifications
      - term_deprecations
      - term_status_boundaries

slots:
  processes:
    description: Data governance processes, nested with part_of.
    slot_uri: dgosite:processes
    range: data governance
    multivalued: true
    inlined_as_list: true
  councils:
    description: Data governance councils.
    slot_uri: dgosite:councils
    range: data governance council
    multivalued: true
    inlined_as_list: true
  people:
    slot_uri: dgosite:people
    range: person
    multivalued: true
    inlined_as_list: true
  organizations:
    slot_uri: dgosite:organizations
    range: organization
    multivalued: true
    inlined_as_list: true
  council_roles:
    description: Council roles such as chair; `type` picks the kind.
    slot_uri: dgosite:council_roles
    range: council role
    multivalued: true
    inlined_as_list: true
  governance_roles:
    description: >-
      Governance roles held outside a term. Roles normally sit in a term's
      responsibilities instead.
    slot_uri: dgosite:governance_roles
    range: governance role
    multivalued: true
    inlined_as_list: true
  business_glossaries:
    slot_uri: dgosite:business_glossaries
    range: business glossary
    multivalued: true
    inlined_as_list: true
  domains:
    slot_uri: dgosite:domains
    range: domain
    multivalued: true
    inlined_as_list: true
  subject_areas:
    slot_uri: dgosite:subject_areas
    range: subject area
    multivalued: true
    inlined_as_list: true
  glossary_terms:
    slot_uri: dgosite:glossary_terms
    range: glossary term
    multivalued: true
    inlined_as_list: true
  definition_sources:
    description: Sources definitions are drawn from; each `id` is the source's IRI.
    slot_uri: dgosite:definition_sources
    range: definition source
    multivalued: true
    inlined_as_list: true
  term_creations:
    slot_uri: dgosite:term_creations
    range: term creation
    multivalued: true
    inlined_as_list: true
  term_modifications:
    slot_uri: dgosite:term_modifications
    range: term modification
    multivalued: true
    inlined_as_list: true
  term_deprecations:
    slot_uri: dgosite:term_deprecations
    range: term deprecation
    multivalued: true
    inlined_as_list: true
  term_status_boundaries:
    description: Dated status boundaries; `type` picks the kind. Quote the dates.
    slot_uri: dgosite:term_status_boundaries
    range: status boundary
    multivalued: true
    inlined_as_list: true
