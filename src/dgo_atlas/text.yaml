# Every piece of wording the site generates, with its default.
#
# Override any entry from dgo-atlas.yaml by its dotted key:
#
#   text:
#     term.history: Change log
#     home.browse_terms: Find a definition
#
# `dgo-atlas text` lists every key with its current value. {placeholders} are
# filled in by the site; keep them in an override. Counts have a `one` and an
# `other` form. The headers (eyebrow, title, lede) of the generated index pages
# can also be set, with intro prose, from a Markdown file at the page's path
# in the content directory (e.g. content/governance.md).

site:
  skip_link: Skip to content
  menu: Menu
  search_placeholder: Search terms, data, people, councils
  search_label: Search the glossary
  search_results: Search results
  # The key hint shown in the search box. The shortcut is Ctrl+K (⌘K on a Mac).
  search_shortcut: Ctrl K
  theme_toggle: Switch colour theme
  built_on: Built {date}
  sections: Site sections
  breadcrumb: Breadcrumb
  # Read aloud before each value in a list row, e.g. "State: Approved".
  cell_label: "{label}:"
  report_title: Something wrong?
  report_body: If a definition doesn't match what you see in the data, tell the people responsible for it.
  report_link: Report a discrepancy
  footer_credit: Built with DGO Atlas {version} on the {ontology} {dgo_version}
  ontology_name: Data Governance Ontology

