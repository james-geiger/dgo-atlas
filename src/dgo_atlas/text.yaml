state:
  approved:
    label: Approved
    description: Its creation was approved by the responsible council. Build on it.
    definition: Approved definition
  proposed:
    label: Proposed
    description: "Its creation is still under way: drafted or submitted for review, not yet decided."
    definition: Proposed definition
  deprecated:
    label: Deprecated
    description: A deprecation of it was approved. Use its successor, if it names one.
    definition: Definition (deprecated)

# A data set's certification status (derived; see derive.certification_state).
certification:
  certified:
    label: Certified
    description: A certification of it was approved by the responsible council. Consumers can rely on it.
  in_progress:
    label: Certification in progress
    description: A certification of it is under way and not yet decided.
  foundational:
    label: Foundational
    description: "Derived from no other data set: the raw data others are built from, such as a table in an operational system. Foundational data isn't certified; the data sets built from it are."
  not_certified:
    label: Not certified
    description: No approved certification is recorded for it.
  certified_on: Certified {date}

