# The data behind the terms (DGO 0.2.0 and later): the systems that store it,
# the data sets in them, their fields, how they are classified, and which are
# certified. Delete this file if you only govern a glossary.
#
# A data store is the operational system, not its database design. A data
# set's domain follows from its subject areas. A data set derived from no
# other is foundational: raw data that others are built from, which is not
# itself certified. A data element `represents` the glossary term whose
# definition gives its values their meaning, one term per element.

sensitivity_levels:              # your own scheme; higher severity = more harm on disclosure
  - id: classification:internal
    label: Internal
    definition: data whose disclosure outside the organization would cause limited harm
    severity: 1
  - id: classification:confidential
    label: Confidential
    definition: data whose disclosure would cause serious harm
    severity: 2

security_levels:                 # higher severity = stricter controls
  - id: classification:role-based
    label: Role-based
    definition: access is granted to roles approved by the data owner
    severity: 1

regulations: []                  # regulatory categories, e.g. PHI (HIPAA); unordered

data_stores:
  - id: data:trial-system
    label: Clinical trial management system
    responsibilities:
      - type: custodian
        role_of: organization:research-office

data_sets:
  - id: data:trial-protocols      # no derived_from: foundational
    label: Trial protocols
    stored_in:
      - data:trial-system
    in_subject_area:
      - area:clinical-research
    sensitivity: classification:confidential
    security_level: classification:role-based
    responsibilities:
      - type: owner
        role_of: organization:research-office

  - id: data:trial-reporting      # built from the protocols, and certified below
    label: Trial reporting
    stored_in:
      - data:trial-system
    in_subject_area:
      - area:clinical-research
    derived_from:
      - data:trial-protocols
    sensitivity: classification:confidential
    security_level: classification:role-based

data_elements:                   # each is part of exactly one data set
  - id: data:protocol-status
    label: protocol status
    part_of: data:trial-protocols
    # represents: term:protocol-status   # the glossary term that gives its values meaning
  - id: data:reporting-status
    label: protocol status
    part_of: data:trial-reporting
    derived_from:
      - data:protocol-status

# A data set is certified by a creation of it, just as a term is created: the
# data set is certified once the creation reaches an approved status boundary,
# on that date.
lifecycle_processes:
  - id: process:trial-reporting-certification
    type: creation
    label: Certification of "Trial reporting"
    has_output: data:trial-reporting
    part_of: process:research-data-governance   # so certified by that process's council

status_boundaries:
  - type: drafted
    part_of: process:trial-reporting-certification
    occurred_on: "2026-01-12"
  - type: approved
    part_of: process:trial-reporting-certification
    occurred_on: "2026-01-20"
