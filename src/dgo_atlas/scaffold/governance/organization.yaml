# Who governs: governance processes, councils, and the people and
# organizations who sit on them or hold roles for terms.
#
# `type` values are DGO class names (owner, chair, approved...), as DGO spells them.

processes:
  - id: process:data-governance
    label: Data governance at Example Organization
  - id: process:research-data-governance
    label: Research data governance
    part_of: process:data-governance

councils:
  - id: council:research-council
    label: Research Data Governance Council
    participates_in: process:research-data-governance   # governs terms created within this process
    has_member:
      - person:alex-rivera
      - person:sam-chen

people:
  - id: person:alex-rivera
    label: Alex Rivera
    title: Director of Research Analytics
    email: alex.rivera@example.org
  - id: person:sam-chen
    label: Sam Chen
    title: Clinical Research Manager

organizations:
  - id: organization:research-office
    label: Office of Research
    email: research@example.org
    has_member:                   # people or organizations; listed on its page
      - person:sam-chen

council_roles:
  - type: chair
    role_of: person:alex-rivera
    realized_in: process:research-data-governance
  - type: documentation steward
    role_of: person:sam-chen
    realized_in: process:research-data-governance
