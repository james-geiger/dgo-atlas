id: https://w3id.org/dgo-atlas/config
name: dgo_atlas_config
title: DGO Atlas site configuration
description: >-
  The site configuration an implementer writes in dgo-atlas.yaml, kept
  separate from governance data. Anything per-page is keyed by the IRI (or
  CURIE) of the object the page is about.
version: 0.1.0
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  dgoatlas: https://w3id.org/dgo-atlas/
default_prefix: dgoatlas
default_range: string
imports:
  - linkml:types

classes:
  SiteConfig:
    tree_root: true
    description: The contents of dgo-atlas.yaml.
    slots:
      - dgo_version
      - dgo_source
      - title
      - language
      - organization
      - description
      - contact_email
      - base_path
      - show_identifiers
      - iri_base
      - namespaces
      - prefixes
      - paths
      - repository
      - suggest_change_url
      - brand
      - pages
      - text

  KindNamespace:
    description: >-
      Where one kind of object is minted and how its ids are written, keyed
      by kind (e.g. `organization: {iri_segment: offices, authoring_prefix:
      office}`). Either field may be left out to keep its default.
    slots: [kind, iri_segment, authoring_prefix]

  Prefix:
    description: >-
      A prefix ids or semantic types may use, written as `prefix: namespace`
      (e.g. `bfo: http://purl.obolibrary.org/obo/BFO_`).
    slots: [prefix, namespace]

  Paths:
    description: Where things live, relative to dgo-atlas.yaml.
    slots: [data, content, output]

  Repository:
    description: >-
      The implementer's source repository, for "view source" links. Omit it
      and the links are left off.
    slots: [url, branch]

  Brand:
    description: Look of the site. Every field is optional.
    slots: [mark, accent, accent_dark, fonts_url, display_font, body_font, serif_font]

  PageSetting:
    description: Settings for one page, keyed by the IRI or CURIE of what it is about.
    slots: [about, accent]

  TextOverride:
    description: >-
      Replacement wording for one text key, written as `key: wording`
      (e.g. `term.history: Change log`). `dgo-atlas text` lists the keys.
    slots: [key, value]

slots:
  dgo_version:
    description: >-
      The Data Governance Ontology release to use, as its tag (e.g. "0.1.0").
      Its schema is imported from the DGO repository's dist/dgo.yaml at that
      tag. Quote it, or YAML may read it as a number.
    required: true
    pattern: "^[0-9A-Za-z][0-9A-Za-z._-]*$"
  dgo_source:
    description: >-
      Import DGO from here instead of the release URL: a URL, or a path
      relative to dgo-atlas.yaml, to a single-file DGO schema (for a mirror,
      a fork, or offline builds). dgo_version still names the release.
  show_identifiers:
    description: >-
      Show the Identifier panel (id, expanded IRI, DGO class) on term,
      council, person and organization pages. Set false to hide it.
    range: boolean
    ifabsent: true
  title:
    description: The site's name, shown in the header and every page title.
    required: true
  language:
    description: >-
      The language the site is written in, as a BCP 47 tag (e.g. "en",
      "fr-CA"). Set it to match any `text:` translations, so screen readers
      pronounce the pages correctly.
    pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$"
    ifabsent: string(en)
  organization:
    description: The organization the site belongs to, shown under the title.
  description:
    description: One sentence describing the site, used on the landing page and in search results.
  contact_email:
    description: Where readers report a problem with a definition.
  base_path:
    description: >-
      Where the site is served from: "/" for a custom domain, "/<repo>/" for
      a GitHub Pages project site. Only the 404 page uses it.
    ifabsent: string(/)
  iri_base:
    description: >-
      The namespace every id is minted in: a base you control and will keep
      stable, such as a w3id.org redirect (e.g. https://w3id.org/acme/). Each
      kind of object gets its own namespace under it (see `namespaces`), and
      each page is published at its IRI's path under the site, so one
      redirect from this base to the site resolves every IRI. Never change it
      once IRIs are published.
    range: uri
    required: true
    pattern: "^https?://"
  namespaces:
    description: >-
      Each kind's namespace and authoring prefix: objects of a kind are minted
      at <iri_base><iri_segment>/<name> and written <authoring_prefix>:<name>.
      iri_segment is part of every IRI, so never change it (or override a
      default) once IRIs are published; authoring_prefix is only how ids are
      written and may change at any time.
    range: KindNamespace
    multivalued: true
    inlined: true
  kind:
    identifier: true
  iri_segment:
    description: The path segment after iri_base for this kind's IRIs (permanent once published).
  authoring_prefix:
    description: The prefix this kind's ids are written with (may change at any time).
    range: ncname
  prefixes:
    description: >-
      Extra prefixes, as `prefix: namespace`: those of the ontologies your
      semantic types come from, and any alias for one of your own namespaces.
      Each kind's authoring prefix is declared for you.
    range: Prefix
    multivalued: true
    inlined: true
  prefix:
    identifier: true
    range: ncname
  namespace:
    range: uri
    required: true
  paths:
    range: Paths
    inlined: true
  data:
    description: Directory of governance YAML files (searched recursively).
    ifabsent: string(governance)
  content:
    description: Directory of authored Markdown pages.
    ifabsent: string(content)
  output:
    description: Directory the site is built into. Emptied on every build.
    ifabsent: string(site)
  repository:
    range: Repository
    inlined: true
  url:
    description: Repository web URL, e.g. https://github.com/acme/glossary.
    range: uri
    required: true
  branch:
    ifabsent: string(main)
  suggest_change_url:
    description: >-
      A URL that starts a change request. The term's CURIE is appended, URL
      encoded, so end it with a query parameter such as `&term=`.
  brand:
    range: Brand
    inlined: true
  mark:
    description: One or two characters shown in the header's brand mark.
  accent:
    description: Accent colour for links and actions, as a CSS colour (e.g. "#6B3FA0").
  accent_dark:
    description: Accent colour used in dark mode; defaults to a lightened accent.
  fonts_url:
    description: A Google Fonts (or other) stylesheet URL loading the fonts named below.
  display_font:
    description: CSS font-family for headings.
  body_font:
    description: CSS font-family for body text.
  serif_font:
    description: CSS font-family for definitions and ledes.
  pages:
    description: Per-page settings keyed by the IRI or CURIE the page is about.
    range: PageSetting
    multivalued: true
    inlined: true
  about:
    identifier: true
    range: uriorcurie
  text:
    description: >-
      Replacement wording for the site, keyed by text key (e.g.
      `term.history: Change log`). Run `dgo-atlas text` to list every key and
      its default.
    range: TextOverride
    multivalued: true
    inlined: true
  key:
    identifier: true
  value:
    required: true
