# # dgo-atlas.example.yaml: every setting dgo-atlas.yaml accepts, at its default.
# #
# # Generated by `python -m dgo_atlas.generate` from src/dgo_atlas/schema/config.yaml
# # and src/dgo_atlas/text.yaml. Do not edit; change those and regenerate.
# #
# # Everything is commented out. Lines starting `# # ` explain; lines starting
# # `# ` are settings. To use a block (or the whole file), remove one `# ` from
# # each of its lines (Cmd+/ or Ctrl+/ in most editors): the settings become
# # YAML and the explanations stay comments. Only dgo_version, title and
# # prefixes are required; leave out anything else to keep its default.

# # The Data Governance Ontology release to use, as its tag (e.g. "0.1.0"). Its
# # schema is imported from the DGO repository's dist/dgo.yaml at that tag.
# # Quote it, or YAML may read it as a number. (required; shown is the newest
# # release this version of DGO Atlas is tested with)
# dgo_version: "0.1.1"

# # Import DGO from here instead of the release URL: a URL, or a path relative
# # to dgo-atlas.yaml, to a single-file DGO schema (for a mirror, a fork, or
# # offline builds). dgo_version still names the release.
# dgo_source:

# # The site's name, shown in the header and every page title. (required)
# title:

# # The organization the site belongs to, shown under the title.
# organization:

# # One sentence describing the site, used on the landing page and in search
# # results.
# description:

# # Where readers report a problem with a definition.
# contact_email:

# # Where the site is served from: "/" for a custom domain, "/<repo>/" for a
# # GitHub Pages project site. Only the 404 page uses it.
# base_path: /

# # Show the Identifier panel (id, expanded IRI, DGO class) on term, council,
# # person and organization pages. Set false to hide it.
# show_identifiers: true

# # The instance namespaces used in governance data, as `prefix: namespace`.
# # (required)
# prefixes:
#   # One entry per prefix your ids use; this one is an example, with no
#   # default.
#   org: https://data.example.org/governance/

# paths:
#   # Directory of governance YAML files (searched recursively).
#   data: governance
#   # Directory of authored Markdown pages.
#   content: content
#   # Directory the site is built into. Emptied on every build.
#   output: site

# repository:
#   # Repository web URL, e.g. https://github.com/acme/glossary. (required)
#   url:
#   branch: main

# # A URL that starts a change request. The term's CURIE is appended, URL
# # encoded, so end it with a query parameter such as `&term=`.
# suggest_change_url:

# brand:
#   # One or two characters shown in the header's brand mark. (unset by default:
#   # the initials of the title are used)
#   mark:
#   # Accent colour for links and actions, as a CSS colour (e.g. "#6B3FA0").
#   # (the default, from site.css)
#   accent: "#1D5C96"
#   # Accent colour used in dark mode; defaults to a lightened accent. (unset by
#   # default: the accent mixed half and half with white is used)
#   accent_dark:
#   # A Google Fonts (or other) stylesheet URL loading the fonts named below.
#   # (the default stylesheet)
#   fonts_url: https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Zilla+Slab:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap
#   # CSS font-family for headings. (the default, from site.css)
#   display_font: Oswald, 'Haettenschweiler', 'Arial Narrow', sans-serif
#   # CSS font-family for body text. (the default, from site.css)
#   body_font: Jost, 'Futura', system-ui, -apple-system, sans-serif
#   # CSS font-family for definitions and ledes. (the default, from site.css)
#   serif_font: "'Zilla Slab', Georgia, 'Times New Roman', serif"

# # Per-page settings keyed by the IRI or CURIE the page is about.
# pages: {}
# # No per-page settings by default. Each entry is keyed by an id, for example:
# # pages:
# #   org:research:
# #     accent: "#2E7D6B"

